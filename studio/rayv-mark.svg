<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="RAYV">
<style>
.beams{animation:beams 3.2s ease-in-out infinite}
@keyframes beams{0%,60%{opacity:.85}74%{opacity:1}100%{opacity:.85}}
.light{stroke-dasharray:16 100;stroke-dashoffset:16;animation:descend 3.2s infinite}
@keyframes descend{0%{stroke-dashoffset:16;animation-timing-function:cubic-bezier(.5,0,.9,.5)}70%{stroke-dashoffset:-84}100%{stroke-dashoffset:-84}}
.src{opacity:.6;transform-box:fill-box;transform-origin:center;animation:src 3.2s ease-out infinite}
@keyframes src{0%,68%{transform:scale(1);opacity:.6}73%{transform:scale(1.45);opacity:1}100%{transform:scale(1);opacity:.6}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-out infinite}
@keyframes pulse{0%,70%{transform:scale(1);opacity:.7}100%{transform:scale(7);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.light{opacity:0}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f0eb"/><stop offset="1" stop-color="#55554f"/></linearGradient></defs>
<circle class="pulse" cx="32" cy="52" r="6" stroke="#8f8f8a" stroke-width=".4"/>
<g class="beams" fill="url(#g)">
<polygon points="3,8 14,8 32,52"><animate attributeName="points" values="3,8 14,8 32,52;1,8 12.5,8 32,52;3,8 14,8 32,52" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="6.4s" repeatCount="indefinite"/></polygon>
<polygon points="50,8 61,8 32,52"><animate attributeName="points" values="50,8 61,8 32,52;51.5,8 63,8 32,52;50,8 61,8 32,52" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="6.4s" repeatCount="indefinite"/></polygon>
</g>
<g stroke="#f1f0eb" stroke-width="1.2" stroke-linecap="butt"><path class="light" pathLength="100" d="M8.5 8 29.06 46.5"/><path class="light" pathLength="100" d="M55.5 8 34.94 46.5"/></g>
<rect class="src" x="28" y="48" width="8" height="8" fill="#f1f0eb"/>
</svg>
